name: Offline checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r stage_3/code/requirements.txt -r app/requirements.txt
      - run: python -B -m unittest discover -s stage_3/code -p 'test_*.py' -v
      - run: python -B -m unittest app.test_api -v
      - run: python -B -m unittest stage_4.test_workflow stage_4.test_semantic app.test_workflow_api -v
      - run: python -B prepare_public.py
      - run: node --check docs/stage3.js
      - run: node --check docs/workspace.js
